apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: express-helm
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/levi-dev-stack/express-helm-argocd.git
    targetRevision: main
    path: .

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
